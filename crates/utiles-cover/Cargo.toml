[package]
name = "utiles-cover"
description = "web-map-tile coverage for geojson/geo-types"
version.workspace = true
authors.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["geo", "mercator", "tile", "geojson"]
categories = ["science::geo"]

[features]
default = ["geo-types", "geojson"]
geojson = ["dep:geojson"]
geo-types = ["dep:geo-types"]

[dependencies]
geo-types = { workspace = true, optional = true }
geojson = { workspace = true, optional = true }
utiles-core = { version = "0.9.0", path = "../utiles-core", default-features = false, features = [] }

[dev-dependencies]
geo-types = { workspace = true }
geojson = { workspace = true }

[lints]
workspace = true
