on:
  push:
    branches:
      - "*"
      - "*/*"
      - "**"
      - "!main"
      - "!master"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install-rust-stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy,rustfmt
      - uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        if: github.event_name != 'release' && github.event_name != 'workflow_dispatch'
      - run: just ci

  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64]
    #        target: [x86_64, x86, aarch64, armv7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter --verbose
          sccache: "true"
          working-directory: ./utiles-pyo3
      #          manylinux: auto

      - name: pytest
        if: ${{ startsWith(matrix.target, 'x86_64') }}
        shell: bash
        run: |
          set -e
          cd utiles-pyo3
          pip install click
          pip install utiles --no-index --no-deps --find-links dist --force-reinstall
          pip install -r requirements.dev.txt
          pytest --benchmark-disable

  typecheck:
    name: typecheck-python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: install dependencies
        run: uv sync --locked
      - name: mypy
        run: uv run mypy --config-file utiles-pyo3/pyproject.toml utiles-pyo3/python utiles-pyo3/tests utiles-pyo3/bench

  test-python:
    name: test-python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.14t", "pypy3.11"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: install dependencies
        run: uv sync --locked
      - name: install utiles
        run: uv run maturin develop -m utiles-pyo3/Cargo.toml
        env:
          RUST_BACKTRACE: 1
      - name: package smoke test
        run: uv run python -m utiles
      - name: pytest
        run: uv run pytest --benchmark-disable --config-file=utiles-pyo3/pyproject.toml utiles-pyo3
